# ===============================================
# 毎朝自動判定 ＆ 判定後自動クリーンアップ
# ===============================================
name: 毎朝自動判定

on:
  schedule:
    - cron: "30 20 * * *"   # UTC 20:30 = JST 翌05:30（タイマー実行）
  push:
    paths:
      - 'data/raw/*.csv'    # バッチ等でCSVが追加されたら即自動起動！
  workflow_dispatch:        # 手動実行ボタンも維持

jobs:
  morning-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: パッケージインストール
        run: pip install -r requirements.txt

      # ① 点検データの特徴量抽出
      - name: 特徴量抽出
        run: |
          python src/extract_features.py \
            --input  data/raw \
            --output data/features \
            --config config/settings.yaml

      # ② 異常判定実行
      - name: 異常判定実行
        run: |
          python src/predict.py \
            --features data/features/features_latest.csv \
            --models   models \
            --output   data/results/results_latest.json \
            --config   config/settings.yaml

      # ③ 判定済み生データの自動削除（お掃除）
      - name: 判定済みCSVのクリーンアップ
        run: |
          # .gitkeep 以外のCSVファイルを削除してrawフォルダを空にする
          find data/raw/ -type f -name "*.csv" -delete
          echo "✅ 判定完了に伴い、data/raw/ の古いCSVを自動削除しました。"

      # ④ 判定結果の保存 ＆ お掃除結果をコミット
      - name: 結果保存とお掃除をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results/ data/raw/
          git diff --cached --quiet || git commit -m "📊 朝の点検結果更新 ＆ データ自動お掃除 [skip ci]"
          git push
