# ===============================================
# 毎週月曜 AM2:00(JST) に自動再学習
# ===============================================
name: 毎週自動再学習

on:
  schedule:
    - cron: "0 17 * * 0"   # UTC日曜17:00 = JST月曜02:00
  workflow_dispatch:         # 手動実行ボタン有効化

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: パッケージインストール
        run: pip install -r requirements.txt

      - name: モデル学習・比較
        run: |
          python src/train_models.py \
            --features_dir data/features \
            --models       models \
            --reports      reports \
            --config       config/settings.yaml

      - name: 生成ファイルをコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🤖 自動再学習 $(date +'%Y-%m-%d %H:%M JST')"
          git push
