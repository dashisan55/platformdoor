<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プラットフォームドア異常予兆検知ダッシュボード (1画面表示版)</title>
<style>
  :root {
    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-accent: #00bfff;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-header: #0f172a;
    --border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden; /* 画面全体のスクロールを無効化 */
    font-family: 'Segoe UI', 'Meiryo', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-size: 12px;
  }

  /* アプリケーション全体コンテナ */
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px 12px;
    gap: 8px;
  }

  /* ヘッダー＆サマリー統合バー */
  header {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    flex-shrink: 0;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-brand .logo { font-size: 22px; }
  .header-brand h1 { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; }
  .header-brand p { font-size: 10px; color: var(--text-muted); }

  .summary-inline {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .summary-badge {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 12px;
    text-align: center;
    min-width: 80px;
  }
  .summary-badge .val { font-size: 16px; font-weight: 700; line-height: 1; }
  .summary-badge .lbl { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
  .val-total { color: var(--primary-accent); }
  .val-normal { color: var(--success); }
  .val-warning { color: var(--warning); }
  .val-danger { color: var(--danger); }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .last-updated { font-size: 10px; color: var(--text-muted); }
  .btn-refresh {
    background: var(--primary-light);
    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
  .btn-refresh:hover { opacity: 0.9; }

  /* メインコンテンツ 3カラムレイアウト */
  .main-layout {
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    gap: 8px;
    flex: 1;
    min-height: 0; /* 子要素のスクロール制限に必須 */
  }

  /* 共通カードスタイル */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .card-header {
    background: var(--card-header);
    border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--primary-accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .card-body {
    padding: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
  }

  /* === 左カラム：即時判定 & ベースライン === */
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }

  /* ドロップゾーン */
  .drop-zone {
    border: 2px dashed var(--primary-light);
    border-radius: 8px;
    padding: 14px 8px;
    text-align: center;
    cursor: pointer;
    background: rgba(59, 130, 246, 0.05);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    background: rgba(59, 130, 246, 0.15);
    border-color: var(--primary-accent);
  }
  .drop-zone .dz-icon { font-size: 26px; margin-bottom: 4px; }
  .drop-zone .dz-title { font-size: 12px; font-weight: 700; color: var(--primary-accent); }
  .drop-zone .dz-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .drop-zone input[type=file] { display: none; }

  /* ドロップ判定結果表示 */
  .judge-result {
    border-radius: 6px;
    padding: 10px;
    display: none;
    flex-shrink: 0;
  }
  .judge-result.show { display: block; }
  .judge-danger  { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); }
  .judge-warning { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); }
  .judge-normal  { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }

  .judge-main-badge {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .judge-label { font-size: 16px; font-weight: 800; }
  .judge-label-danger { color: var(--danger); }
  .judge-label-warning { color: var(--warning); }
  .judge-label-normal { color: var(--success); }

  .judge-metrics-mini {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 10px;
    margin-bottom: 8px;
  }
  .metric-item { background: rgba(0,0,0,0.2); padding: 4px 6px; border-radius: 4px; }
  .metric-item .val { font-weight: 700; color: #fff; }

  .btn-modal-open {
    width: 100%;
    background: var(--border);
    color: var(--text-main);
    border: none;
    padding: 4px;
    border-radius: 4px;
    font-size: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-modal-open:hover { background: var(--primary-light); }

  /* ドリフトアラート */
  .drift-summary-box {
    font-size: 10px;
    line-height: 1.5;
  }
  .drift-pill {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  /* === 中央カラム：監視ログテーブル === */
  .center-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .filter-bar-mini {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 6px;
    background: rgba(0,0,0,0.2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .filter-bar-mini select {
    background: var(--bg-dark);
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
  }

  .table-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .result-table th {
    position: sticky; top: 0;
    background: var(--card-header);
    color: var(--text-muted);
    padding: 6px 8px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .result-table td {
    padding: 5px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .result-table tr:hover td { background: rgba(59, 130, 246, 0.1); }
  .result-table tr.row-danger td { background: rgba(239, 68, 68, 0.1); }
  .result-table tr.row-warning td { background: rgba(245, 158, 11, 0.1); }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
  }
  .badge-normal  { background: rgba(16,185,129,0.2); color: var(--success); }
  .badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
  .badge-danger  { background: rgba(239,68,68,0.2); color: var(--danger); }

  .pagination-mini {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 4px;
    background: rgba(0,0,0,0.2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .page-btn {
    background: var(--bg-dark);
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 10px;
  }
  .page-btn.active { background: var(--primary-light); color: #fff; }

  /* === 右カラム：分析グラフ & 詳細 === */
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }

  canvas { width: 100% !important; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 10px;
  }
  .detail-item {
    background: rgba(0,0,0,0.2);
    padding: 4px 6px;
    border-radius: 4px;
    display: flex;
    justify-content: space-between;
  }
  .detail-item .k { color: var(--text-muted); }
  .detail-item .v { font-weight: 700; color: #fff; }

  .model-mini-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    margin-top: 4px;
  }
  .model-card-mini {
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 4px;
    text-align: center;
  }
  .model-card-mini .m-name { font-size: 8px; color: var(--text-muted); }
  .model-card-mini .m-val { font-size: 11px; font-weight: 700; color: var(--primary-accent); }

  /* モーダルダイアログ (詳細乖離値ポップアップ) */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 90%;
    max-width: 600px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    background: var(--card-header);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--primary-accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-body {
    padding: 14px;
    overflow-y: auto;
    font-size: 11px;
  }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
  }

  .drift-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .drift-table th { background: rgba(0,0,0,0.3); padding: 6px; text-align: left; color: var(--text-muted); }
  .drift-table td { padding: 6px; border-bottom: 1px solid var(--border); }

  .drift-ok   { color: var(--success); font-weight: 700; }
  .drift-warn { color: var(--warning); font-weight: 700; }
  .drift-ng   { color: var(--danger); font-weight: 700; }

  /* ローディング表示 */
  .loading-spinner {
    text-align: center;
    padding: 10px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- ① ヘッダー ＆ サマリー統合バー -->
  <header>
    <div class="header-brand">
      <div class="logo">🚉</div>
      <div>
        <h1>プラットフォームドア 異常予兆検知ダッシュボード</h1>
        <p>五反田駅 1番線 ／ 状態監視保全（CBM）システム</p>
      </div>
    </div>

    <!-- サマリーカード（1行配置） -->
    <div class="summary-inline">
      <div class="summary-badge"><div class="val val-total" id="s-total">-</div><div class="lbl">総判定数</div></div>
      <div class="summary-badge"><div class="val val-normal" id="s-normal">-</div><div class="lbl">✅ 正常</div></div>
      <div class="summary-badge"><div class="val val-warning" id="s-warning">-</div><div class="lbl">⚠️ 要注意</div></div>
      <div class="summary-badge"><div class="val val-danger" id="s-danger">-</div><div class="lbl">🚨 異常予兆</div></div>
    </div>

    <div class="header-actions">
      <span class="last-updated" id="lastUpdated">更新中...</span>
      <button class="btn-refresh" onclick="loadAll()">🔄 更新</button>
    </div>
  </header>

  <!-- ② メイン 3カラムレイアウト (100vh収容) -->
  <div class="main-layout">

    <!-- === 左カラム：現地即時判定 & ベースライン === -->
    <div class="left-col">
      
      <!-- 現地データドラッグ＆ドロップ -->
      <div class="card" style="flex-shrink: 0;">
        <div class="card-header">🔬 現地データ即時判定</div>
        <div class="card-body" style="padding: 8px;">
          <div class="drop-zone" id="dropZone"
               ondragover="onDragOver(event)" ondragleave="onDragLeave(event)"
               ondrop="onDrop(event)" onclick="document.getElementById('fileInput').click()">
            <div class="dz-icon">📂</div>
            <div class="dz-title">CSVファイルをドロップ</div>
            <div class="dz-sub">またはクリックして選択</div>
            <input type="file" id="fileInput" accept=".csv" onchange="onFileSelect(event)">
          </div>
          <div class="judge-result" id="judgeResult"></div>
        </div>
      </div>

      <!-- ベースライン長期トレンド監視 -->
      <div class="card" style="flex: 1;">
        <div class="card-header">📡 長期トレンド（ドリフト監視）</div>
        <div class="card-body">
          <div class="drift-summary-box" id="driftAlertBody">
            <span class="drift-pill badge-normal">監視中</span>
            ベースライン統計を検証中...
          </div>
          <div style="flex: 1; min-height: 110px; margin-top: 6px;">
            <canvas id="driftChart"></canvas>
          </div>
        </div>
      </div>

    </div>

    <!-- === 中央カラム：監視ログテーブル === -->
    <div class="center-col">
      <div class="card" style="height: 100%;">
        <div class="card-header">
          <span>📋 動作判定結果ログ</span>
          <span style="font-size: 9px; color: var(--text-muted);" id="logCountInfo">0件</span>
        </div>

        <!-- フィルターバー -->
        <div class="filter-bar-mini">
          <label>動作: 
            <select id="filterAction" onchange="applyFilter()">
              <option value="">すべて</option>
              <option value="open">開動作</option>
              <option value="close">閉動作</option>
            </select>
          </label>
          <label>号車: 
            <select id="filterCar" onchange="applyFilter()">
              <option value="">すべて</option>
              <option value="1">1号車</option>
              <option value="2">2号車</option>
              <option value="3">3号車</option>
            </select>
          </label>
          <label>判定: 
            <select id="filterLabel" onchange="applyFilter()">
              <option value="">すべて</option>
              <option value="danger">異常予兆</option>
              <option value="warning">要注意</option>
              <option value="normal">正常</option>
            </select>
          </label>
        </div>

        <!-- テーブルエリア（スクロール可能） -->
        <div class="table-container">
          <table class="result-table">
            <thead>
              <tr>
                <th>日時</th>
                <th>号車</th>
                <th>ドア</th>
                <th>動作</th>
                <th>スコア</th>
                <th>判定</th>
              </tr>
            </thead>
            <tbody id="resultTableBody">
              <tr><td colspan="6" class="loading-spinner">読み込み中...</td></tr>
            </tbody>
          </table>
        </div>

        <!-- ページネーション -->
        <div class="pagination-mini" id="pagination"></div>
      </div>
    </div>

    <!-- === 右カラム：分析グラフ & 詳細 === -->
    <div class="right-col">
      
      <!-- スコア推移グラフ -->
      <div class="card" style="height: 150px; flex-shrink: 0;">
        <div class="card-header">📈 スコア推移（直近40動作）</div>
        <div class="card-body" style="padding: 4px 8px;">
          <canvas id="scoreChart" height="110"></canvas>
        </div>
      </div>

      <!-- 選択行のデータ詳細 -->
      <div class="card" style="flex: 1;">
        <div class="card-header">🔍 選択データ詳細</div>
        <div class="card-body">
          <div id="detailPanel">
            <div class="loading-spinner" style="margin-top:20px;">行をクリックすると詳細を表示します</div>
          </div>
        </div>
      </div>

      <!-- AIモデル比較 -->
      <div class="card" style="flex-shrink: 0;">
        <div class="card-header">🧠 AIモデル判定比較</div>
        <div class="card-body" style="padding: 8px;">
          <div id="modelPanel">
            <div style="font-size: 9px; color: var(--text-muted); text-align: center;">選択行のスコア内訳</div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- 特徴量詳細ポップアップモーダル -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <div class="modal-header">
      <span>📊 特徴量詳細・乖離度（σ）解析</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  const RESULTS_URL  = "./data/results/results_latest.json";
  const DRIFT_URL    = "./reports/baseline_drift.csv";
  const BASELINE_URL = "./models/baseline_stats.json";
  const PAGE_SIZE    = 25;

  let allResults = [], filteredResults = [], currentPage = 1;
  let baselineData  = [];
  let baselineStats = {};
  let currentModalData = null;

  // ==================== 初期ロード =================== Cuba
  async function loadAll() {
    await loadBaselineStats();
    await loadResults();
    await loadDrift();
  }

  // ==================== 判定結果読み込み ===================
  async function loadResults() {
    document.getElementById("lastUpdated").textContent = "更新中...";
    try {
      let data;
      try {
        const res = await fetch(RESULTS_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("fetch failed");
        data = await res.json();
      } catch {
        data = generateDemoResults();
      }
      allResults = data.results || [];
      document.getElementById("s-total").textContent   = data.total   || 0;
      document.getElementById("s-normal").textContent  = data.normal  || 0;
      document.getElementById("s-warning").textContent = data.warning || 0;
      document.getElementById("s-danger").textContent  = data.danger  || 0;
      
      const dt = data.predicted_at ? new Date(data.predicted_at).toLocaleString("ja-JP") : "不明";
      document.getElementById("lastUpdated").textContent = dt;
      
      applyFilter();
      drawScoreChart();
    } catch(e) {
      console.error(e);
      document.getElementById("lastUpdated").textContent = "エラー";
    }
  }

  // ==================== ドリフト読み込み ===================
  async function loadDrift() {
    try {
      const res = await fetch(DRIFT_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("drift fetch failed");
      const text = await res.text();
      baselineData = parseCSV(text);
      renderDriftAlert(baselineData);
      drawDriftChart(baselineData);
    } catch(e) {
      console.log("ドリフトデータなし:", e.message);
    }
  }

  // ==================== ベースライン統計読み込み ===================
  async function loadBaselineStats() {
    try {
      const res = await fetch(BASELINE_URL + "?t=" + Date.now());
      if (!res.ok) throw new Error("baseline fetch failed");
      const data = await res.json();
      baselineStats = data.stats || {};
    } catch(e) {
      console.log("ベースライン統計なし:", e.message);
    }
  }

  function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",");
    return lines.slice(1).map(line => {
      const vals = line.split(",");
      const obj = {};
      headers.forEach((h, i) => obj[h.trim()] = vals[i] ? vals[i].trim() : "");
      return obj;
    });
  }

  // ==================== ドリフトアラート表示 ===================
  function renderDriftAlert(rows) {
    const body = document.getElementById("driftAlertBody");
    const dangers  = rows.filter(r => r.status === "異常");
    const warnings = rows.filter(r => r.status === "警告");

    if (dangers.length === 0 && warnings.length === 0) {
      body.innerHTML = `<span class="drift-pill badge-normal">正常</span> 長期トレンド変動なし（基準内）`;
      return;
    }
    let html = "";
    if (dangers.length > 0) {
      html += `<span class="drift-pill badge-danger">🚨 大幅乖離 ${dangers.length}件</span> `;
    }
    if (warnings.length > 0) {
      html += `<span class="drift-pill badge-warning">⚠️ 乖離注意 ${warnings.length}件</span>`;
    }
    body.innerHTML = html;
  }

  // ==================== ドリフトグラフ ===================
  function drawDriftChart(rows) {
    const canvas = document.getElementById("driftChart");
    const container = canvas.parentElement;
    const W = container.offsetWidth || 280;
    const H = container.offsetHeight || 100;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    const mainFeatures = ["mean_current","max_current","rms_current","duration","mean_diff","energy"];
    const displayRows = rows.filter(r => mainFeatures.includes(r.feature)).slice(0, 6);
    if (displayRows.length === 0) return;

    const pad = { l: 5, r: 5, t: 10, b: 20 };
    const cW = W - pad.l - pad.r;
    const cH = H - pad.t - pad.b;
    const barW = cW / displayRows.length;

    const maxVal = Math.max(...displayRows.map(r =>
      Math.max(Math.abs(parseFloat(r.current_mean)||0), Math.abs(parseFloat(r.baseline_mean)||0))
    )) * 1.2 || 1;

    displayRows.forEach((r, i) => {
      const cur   = parseFloat(r.current_mean)  || 0;
      const base  = parseFloat(r.baseline_mean) || 0;
      const drift = parseFloat(r.drift_sigma)   || 0;
      const color = drift >= 3.0 ? "#ef4444" : drift >= 2.0 ? "#f59e0b" : "#10b981";

      const x = pad.l + i * barW + barW * 0.15;
      const bw = barW * 0.7;

      const barH = Math.abs(cur / maxVal) * cH;
      ctx.fillStyle = color;
      ctx.fillRect(x, pad.t + cH - barH, bw, barH);

      const baseY = pad.t + cH - (Math.abs(base / maxVal) * cH);
      ctx.strokeStyle = "#00bfff";
      ctx.setLineDash([2, 2]);
      ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x + bw, baseY); ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#94a3b8"; ctx.font = "8px sans-serif"; ctx.textAlign = "center";
      const label = r.feature.replace("_current","");
      ctx.fillText(label, x + bw/2, pad.t + cH + 12);
    });
  }

  // ==================== ドラッグ＆ドロップ ===================
  function onDragOver(e) { e.preventDefault(); document.getElementById("dropZone").classList.add("drag-over"); }
  function onDragLeave() { document.getElementById("dropZone").classList.remove("drag-over"); }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById("dropZone").classList.remove("drag-over");
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith(".csv")) processCSV(file);
    else alert("CSVファイルをドロップしてください");
  }
  function onFileSelect(e) { const file = e.target.files[0]; if (file) processCSV(file); }

  // ==================== CSV解析＆即時判定 ===================
  function processCSV(file) {
    const result = document.getElementById("judgeResult");
    result.className = "judge-result show judge-normal";
    result.innerHTML = `<div class="loading-spinner">解析中...</div>`;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const features = extractFeatures(e.target.result, file.name);
        if (!features) {
          result.innerHTML = `<div style="color:var(--danger);">❌ 無効なCSVフォーマットです</div>`;
          return;
        }
        const judgment = judgeWithBaseline(features);
        currentModalData = { filename: file.name, features, judgment };
        renderJudgeResult(result, file.name, features, judgment);
      } catch(err) {
        result.innerHTML = `<div style="color:var(--danger);">❌ エラー: ${err.message}</div>`;
      }
    };
    reader.readAsText(file, "Shift_JIS");
  }

  function extractFeatures(text, filename) {
    const lines = text.split("\n").map(l=>l.trim()).filter(l=>l&&!l.startsWith("#"));
    const meta = {};
    let dataStartIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      const parts = lines[i].split(",");
      const key = parts[0]||""; const val = parts[1]||"";
      if (key.includes("駅名"))     meta.station   = val;
      if (key.includes("番線"))     meta.line      = val;
      if (key.includes("号車番号")) meta.car       = val;
      if (key.includes("ドア番号")) meta.door      = val;
      if (key.includes("動作種別")) meta.operation = val;
      if (key.includes("時間"))     { dataStartIdx = i + 1; break; }
    }
    if (dataStartIdx < 0) return null;

    const timeArr=[], leftArr=[], rightArr=[];
    for (let i = dataStartIdx; i < lines.length; i++) {
      const parts = lines[i].split(",");
      if (parts.length < 3) continue;
      const t=parseFloat(parts[0]), l=parseFloat(parts[1]), r=parseFloat(parts[2]);
      if (isNaN(t)||isNaN(l)||isNaN(r)) continue;
      timeArr.push(t); leftArr.push(l); rightArr.push(r);
    }
    if (timeArr.length < 10) return null;

    const currArr = leftArr.map((l,i)=>(l+rightArr[i])/2);
    const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
    const std  = a => { const m=mean(a); return Math.sqrt(mean(a.map(v=>(v-m)**2))); };
    const max  = a => Math.max(...a);
    const min  = a => Math.min(...a);
    const pct  = (a,p) => { const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length*p/100)]; };
    const diffs = a => a.slice(1).map((v,i)=>Math.abs(v-a[i]));
    const skew  = a => { const m=mean(a),s=std(a); return s===0?0:mean(a.map(v=>((v-m)/s)**3)); };
    const kurt  = a => { const m=mean(a),s=std(a); return s===0?0:mean(a.map(v=>((v-m)/s)**4))-3; };
    const d = diffs(currArr);

    return {
      filename, meta,
      mean_current:       +mean(currArr).toFixed(4),
      std_current:        +std(currArr).toFixed(4),
      max_current:        +max(currArr).toFixed(4),
      min_current:        +min(currArr).toFixed(4),
      range_current:      +(max(currArr)-min(currArr)).toFixed(4),
      p25_current:        +pct(currArr,25).toFixed(4),
      p50_current:        +pct(currArr,50).toFixed(4),
      p75_current:        +pct(currArr,75).toFixed(4),
      duration:           +(timeArr[timeArr.length-1]-timeArr[0]).toFixed(4),
      data_points:        timeArr.length,
      mean_diff:          +mean(d).toFixed(4),
      max_diff:           +max(d).toFixed(4),
      energy:             +currArr.reduce((s,v)=>s+v**2,0).toFixed(4),
      rms_current:        +Math.sqrt(mean(currArr.map(v=>v**2))).toFixed(4),
      skewness:           +skew(currArr).toFixed(4),
      kurtosis:           +kurt(currArr).toFixed(4),
      mean_current_left:  +mean(leftArr).toFixed(4),
      mean_current_right: +mean(rightArr).toFixed(4),
      max_current_left:   +max(leftArr).toFixed(4),
      max_current_right:  +max(rightArr).toFixed(4),
    };
  }

  function judgeWithBaseline(features) {
    if (Object.keys(baselineStats).length === 0) {
      return { label:"unknown", score:0, maxDrift:0, details:[] };
    }
    const checkFeatures = [
      "mean_current","max_current","rms_current","std_current",
      "range_current","mean_diff","max_diff",
      "energy","skewness","kurtosis"
    ];
    const details = [];
    let maxDrift = 0;

    checkFeatures.forEach(feat => {
      const base = baselineStats[feat];
      if (!base || features[feat] === undefined) return;
      const bMean = base.mean;
      const bStd  = base.std;
      if (bStd === 0) {
        details.push({ feature:feat, value:features[feat], baseline:+bMean.toFixed(3), drift:0, status:"normal" });
        return;
      }
      const drift = Math.abs(features[feat] - bMean) / bStd;
      maxDrift = Math.max(maxDrift, drift);
      details.push({
        feature: feat,
        value:   features[feat],
        baseline: +bMean.toFixed(3),
        bStd:     +bStd.toFixed(3),
        drift:    +drift.toFixed(2),
        status:   drift >= 3.0 ? "danger" : drift >= 2.0 ? "warning" : "normal"
      });
    });

    const label = maxDrift >= 3.0 ? "danger" : maxDrift >= 2.0 ? "warning" : "normal";
    return { label, score: +(Math.min(1.0, maxDrift/5.0)).toFixed(3), maxDrift: +maxDrift.toFixed(2), details };
  }

  function renderJudgeResult(el, filename, features, judgment) {
    const cfg = {
      danger:  { icon:"🚨", text:"異常予兆",   cls:"judge-danger",  lcls:"judge-label-danger"  },
      warning: { icon:"⚠️", text:"要注意",     cls:"judge-warning", lcls:"judge-label-warning" },
      normal:  { icon:"✅", text:"正常",       cls:"judge-normal",  lcls:"judge-label-normal"  },
      unknown: { icon:"❓", text:"判定不可",   cls:"judge-unknown", lcls:"" },
    };
    const c = cfg[judgment.label] || cfg.unknown;
    el.className = `judge-result show ${c.cls}`;

    el.innerHTML = `
      <div class="judge-main-badge">
        <span class="judge-label ${c.lcls}">${c.icon} ${c.text}</span>
        <span style="font-weight:700;">${judgment.maxDrift}σ</span>
      </div>
      <div class="judge-metrics-mini">
        <div class="metric-item"><span class="k">平均:</span> <span class="val">${features.mean_current}mA</span></div>
        <div class="metric-item"><span class="k">最大:</span> <span class="val">${features.max_current}mA</span></div>
      </div>
      <button class="btn-modal-open" onclick="openModal()">📊 特徴量詳細・乖離値を見る</button>
    `;
  }

  // モーダル表示
  function openModal() {
    if (!currentModalData) return;
    const { filename, features, judgment } = currentModalData;
    const modal = document.getElementById("detailModal");
    const body  = document.getElementById("modalBody");

    const rows = judgment.details.map(d => {
      const cls = d.status === "danger" ? "drift-ng" : d.status === "warning" ? "drift-warn" : "drift-ok";
      const icon = d.status === "danger" ? "🔴" : d.status === "warning" ? "🟡" : "🟢";
      return `<tr>
        <td>${d.feature}</td>
        <td style="text-align:right;">${d.value}</td>
        <td style="text-align:right;">${d.baseline}</td>
        <td style="text-align:right;">${d.bStd}</td>
        <td style="text-align:right;" class="${cls}">${icon} ${d.drift}σ</td>
      </tr>`;
    }).join("");

    body.innerHTML = `
      <div style="margin-bottom:10px; font-weight:700;">📄 ${filename}</div>
      <table class="drift-table">
        <thead>
          <tr><th>特徴量</th><th style="text-align:right;">現在値</th><th style="text-align:right;">基準値</th><th style="text-align:right;">基準σ</th><th style="text-align:right;">乖離度</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    modal.classList.add("show");
  }

  function closeModal() {
    document.getElementById("detailModal").classList.remove("show");
  }

  // ==================== フィルター＆テーブル ===================
  function applyFilter() {
    const fA = document.getElementById("filterAction").value;
    const fC = document.getElementById("filterCar").value;
    const fL = document.getElementById("filterLabel").value;
    filteredResults = allResults.filter(r => {
      if (fA && r.operation !== fA) return false;
      if (fC && r.car !== fC) return false;
      if (fL && r.label !== fL) return false;
      return true;
    });
    currentPage = 1;
    document.getElementById("logCountInfo").textContent = `${filteredResults.length}件`;
    renderTable();
    renderPagination();
  }

  function renderTable() {
    const tbody = document.getElementById("resultTableBody");
    const start = (currentPage - 1) * PAGE_SIZE;
    const items = filteredResults.slice(start, start + PAGE_SIZE);

    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:20px;">データがありません</td></tr>`;
      return;
    }

    tbody.innerHTML = items.map((r, i) => {
      const absIdx = start + i;
      const rowCls = r.label==="danger"?"row-danger":r.label==="warning"?"row-warning":"";
      const badgeText = r.label==="danger"?"🚨 異常予兆":r.label==="warning"?"⚠️ 要注意":r.label==="normal"?"✅ 正常":"❓";
      const badgeCls  = `badge-${r.label||"unknown"}`;
      const actionLabel = r.operation==="open"?"開":r.operation==="close"?"閉":r.operation;
      
      return `<tr class="${rowCls}" onclick="selectRow(${absIdx})" style="cursor:pointer;">
        <td>${(r.datetime||"").slice(5,16)}</td>
        <td>${r.car}号車</td>
        <td>${r.door}番</td>
        <td>${actionLabel}</td>
        <td>${(r.score||0).toFixed(3)}</td>
        <td><span class="badge ${badgeCls}">${badgeText}</span></td>
      </tr>`;
    }).join("");
  }

  function renderPagination() {
    const total = Math.ceil(filteredResults.length / PAGE_SIZE);
    const el = document.getElementById("pagination");
    if (total <= 1) { el.innerHTML = ""; return; }
    let html = "";
    for (let i = 1; i <= total; i++) {
      html += `<button class="page-btn ${i===currentPage?"active":""}" onclick="goPage(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }
  function goPage(p) { currentPage = p; renderTable(); renderPagination(); }

  // ==================== 詳細選択 ===================
  function selectRow(idx) {
    const r = filteredResults[idx]; if (!r) return;
    const dp = document.getElementById("detailPanel");
    const featureRows = Object.entries(r.features||{}).slice(0,8).map(([k,v]) =>
      `<div class="detail-item"><span class="k">${k}</span><span class="v">${typeof v==="number"?v.toFixed(2):v}</span></div>`
    ).join("");
    const actionLabel = r.operation==="open"?"開動作":"閉動作";

    dp.innerHTML = `
      <div style="font-weight:700; margin-bottom:6px; color:var(--primary-accent);">
        ${r.car}号車 ${r.door}番ドア (${actionLabel}) - ${r.datetime}
      </div>
      <div class="detail-grid">${featureRows}</div>
    `;

    const mp = document.getElementById("modelPanel");
    const details = r.model_details||{};
    const items = Object.entries(details).map(([name, d]) => `
      <div class="model-card-mini">
        <div class="m-name">${name.replace("individual_","個:").replace("unified_","統:")}</div>
        <div class="m-val">${d.score != null ? d.score.toFixed(3) : "N/A"}</div>
      </div>
    `).join("");
    mp.innerHTML = `<div class="model-mini-grid">${items}</div>`;
  }

  // ==================== スコア推移グラフ ===================
  function drawScoreChart() {
    const canvas = document.getElementById("scoreChart");
    const container = canvas.parentElement;
    const W = container.offsetWidth || 300;
    const H = container.offsetHeight || 110;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);

    const data = allResults.slice(-40);
    if (data.length === 0) return;

    const pad = { l: 25, r: 5, t: 10, b: 15 };
    const cW = W - pad.l - pad.r;
    const cH = H - pad.t - pad.b;

    ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 1;
    [0.4, 0.8].forEach(v => {
      const y = pad.t + cH * (1 - v);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cW, y); ctx.stroke();
    });

    ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1.5; ctx.beginPath();
    data.forEach((r, i) => {
      const x = pad.l + (i / (data.length - 1 || 1)) * cW;
      const y = pad.t + cH * (1 - (r.score || 0));
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    data.forEach((r, i) => {
      const x = pad.l + (i / (data.length - 1 || 1)) * cW;
      const y = pad.t + cH * (1 - (r.score || 0));
      ctx.fillStyle = r.label === "danger" ? "#ef4444" : r.label === "warning" ? "#f59e0b" : "#10b981";
      ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
    });
  }

  // デモデータ生成
  function generateDemoResults() {
    const results = []; const ops = ["open","close"]; const now = new Date();
    for(let car=1; car<=3; car++) {
      for(let door=1; door<=3; door++) {
        for(const op of ops) {
          const score = Math.random() * 0.30;
          const label = score >= 0.80 ? "danger" : score >= 0.60 ? "warning" : "normal";
          results.push({
            id: `${now.toISOString()}_${car}_${door}_${op}`,
            datetime: now.toISOString().slice(0, 16).replace("T", " "),
            car: String(car), door: String(door), operation: op,
            score: +score.toFixed(4), label,
            model_details: {
              individual_isolation_forest: { score: +(score+0.02).toFixed(4) },
              individual_lof:              { score: +(score+0.01).toFixed(4) },
              unified_isolation_forest:    { score: +score.toFixed(4) }
            },
            features: {
              mean_current: +(80+Math.random()*20).toFixed(1),
              max_current:  +(300+Math.random()*100).toFixed(1)
            }
          });
        }
      }
    }
    return { predicted_at: now.toISOString(), total: results.length, normal: results.length, warning:0, danger:0, results };
  }

  window.addEventListener("load", loadAll);
  window.addEventListener("resize", () => {
    drawScoreChart();
    if (baselineData.length) drawDriftChart(baselineData);
  });
</script>
